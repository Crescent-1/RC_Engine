# Publishes demo/ to GitHub Pages.
#
# Deploys the snapshot exactly as committed — it does NOT rebuild it, because
# the production SQLite DB never leaves the local machine. Refresh the data with
#   python tools/build_demo_snapshot.py
# and commit demo/data/ before pushing.
#
# Delete this file if you deploy via Cloudflare Pages instead.
name: Deploy demo

on:
  push:
    branches: [master]
    paths: ["demo/**", ".github/workflows/deploy-demo.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail if the snapshot was built with costs included
        run: |
          if grep -q '"costs_included":true' demo/data/corpus.json; then
            echo "::error::demo/data/corpus.json was built with --include-costs. Rebuild without it."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
